repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.11
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-check
        name: Run job-genie tests
        entry: uv run --package job-genie pytest
        language: system
        types: [python]
        pass_filenames: false
        args: ["job-genie/tests/"]
        files: ^job-genie/
