[project]
name = "riva-agent"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "common",
    "job-genie",
    "lighthouse-genie",
    "money-genie",
    "workout-genie",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
]

[tool.uv.workspace]
members = [
    "common",
    "workout-genie",
    "money-genie",
    "job-genie",
    "lighthouse-genie",
    "experiments",
]

[tool.uv.sources]
common = { workspace = true }
job-genie = { workspace = true }
money-genie = { workspace = true }
workout-genie = { workspace = true }
lighthouse-genie = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.commitizen]
version_provider = "pep621"
version_scheme = "semver2"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
