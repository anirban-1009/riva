[project]
name = "riva-agent"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "common",
    "job-genie",
    "lighthouse-genie",
    "money-genie",
    "workout-genie",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
    "laya-mlx>=0.2.0",
    "spacy>=3.8.0",
    "numpy>=1.26.0",
    "en-core-web-sm",
]

[project.scripts]
riva = "riva_agent.cli:main"

[tool.uv.workspace]
members = [
    "common",
    "workout-genie",
    "money-genie",
    "job-genie",
    "lighthouse-genie",
    "experiments",
]

[tool.uv.sources]
common = { workspace = true }
job-genie = { workspace = true }
money-genie = { workspace = true }
workout-genie = { workspace = true }
lighthouse-genie = { workspace = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["src/riva_agent"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.commitizen]
version_provider = "pep621"
version_scheme = "semver2"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
